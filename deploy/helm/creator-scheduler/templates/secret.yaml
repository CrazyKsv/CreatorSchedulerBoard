{{- /*
Backend Secret. Holds the JWT SECRET_KEY.

- The value is resolved by the `creator-scheduler.secretKey` helper, which
  reuses an existing in-cluster value on upgrade so we do not invalidate
  outstanding JWTs. On first install a 48-char random value is generated.
- `helm.sh/resource-policy: keep` keeps the Secret after `helm uninstall`
  so a reinstall preserves the same signing key (matching the PVC's
  default retention behavior on RWO StorageClasses).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "creator-scheduler.componentName" (dict "ctx" . "component" "backend") }}
  labels:
    {{- include "creator-scheduler.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ include "creator-scheduler.secretKey" . }}
