# nginx configuration for the production frontend container.
# The Kubernetes Ingress is responsible for routing /api/v1 to the backend;
# this server only serves the built SPA assets and handles the SPA fallback.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't let the browser cache index.html — we want clients to pick up
    # the latest bundle hashes after a helm upgrade.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Hashed asset files under /assets/ are safe to cache aggressively.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so react-router can
    # resolve the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
